<!DOCTYPE HTML>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>Завдання 2-3</title>
</head>
<body>

    <p><a href="index.html">← Назад</a></p>
    <h1>Завдання 2-3</h1>
    <hr>

    <div style="margin-top: 20px;">
        <label for="colorSelect">Оберіть колір: </label>
        <select id="colorSelect" onchange="changeColor()">
            <option value="black">Чорний</option>
            <option value="red">Червоний</option>
            <option value="green">Зелений</option>
            <option value="blue">Синій</option>
            <option value="orange">Помаранчевий</option>
        </select>
    </div>

    <div id="square" style="width: 100px; height: 100px; background-color: black; margin-top: 20px;"></div>

    <script>
        function changeColor() {
            var select = document.getElementById('colorSelect');
            var square = document.getElementById('square');
            square.style.backgroundColor = select.value;
        }
    </script>

</body>
</html>
